volumes:
  envergo_postgres_data: {}
  envergo_postgres_data_backups: {}
  envergo_node_modules: {}

services:
  django:
    build:
      context: .
      dockerfile: ./compose/django/Dockerfile
    environment:
      - LANG=fr_FR.UTF-8
      - LC_ALL=fr_FR.UTF-8
      - DJANGO_CELERY_BROKER_URL=redis://redis:6379/0
    image: envergo_django
    container_name: envergo_django
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app:z
      - envergo_node_modules:/app/node_modules
    env_file:
      - .env
      - ./envs/django
      - ./envs/postgres
    ports:
      - "8000:8000"
    command: /start

  celery:
    build:
      context: .
      dockerfile: ./compose/django/Dockerfile
    image: envergo_django
    container_name: envergo_celery
    environment:
      - LANG=fr_FR.UTF-8
      - LC_ALL=fr_FR.UTF-8
      # celery_app.py falls back to production settings when unset
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DJANGO_CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app:z
    env_file:
      - .env
      - ./envs/django
      - ./envs/postgres
    command: celery -A config.celery_app worker --loglevel info

  redis:
    image: redis:7-alpine
    container_name: envergo_redis

  postgres:
    build:
      context: .
      dockerfile: ./compose/postgres/Dockerfile
    image: envergo_postgres
    container_name: envergo_postgres
    volumes:
      - envergo_postgres_data:/var/lib/postgresql/data:Z
      - envergo_postgres_data_backups:/backups:z
    env_file:
      - .env
      - ./envs/postgres
    shm_size: 1g

  node:
    build:
      context: .
      dockerfile: ./compose/node/Dockerfile
    image: envergo_node
    container_name: envergo_node
    depends_on:
      - django
    volumes:
      - .:/app:z
      # http://jdlm.info/articles/2016/03/06/lessons-building-node-app-docker.html
      - envergo_node_modules:/app/node_modules
    command: npm run dev
