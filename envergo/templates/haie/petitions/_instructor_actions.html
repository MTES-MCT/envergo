{# Same right gutter as the DSFR side menu inner. Without it the group’s negative margins overflow the sticky sidebar. #}
<div class="fr-pr-md-3w">
  <ul class="fr-btns-group fr-btns-group--center fr-btns-group--icon-left fr-px-2w fr-px-md-0 fr-mt-2w">
    <li>
      <button class="hedge-input-open-btn fr-btn fr-btn--secondary fr-btn--icon-left fr-icon-haie"
              type="button"
              data-fr-opened="false"
              aria-controls="hedge-input-modal">Ouvrir la carte des haies</button>
    </li>
    <li>
      <a class="fr-btn fr-btn--secondary fr-btn--icon-left fr-icon-download-line"
         href="{% url 'petition_project_hedge_data_export' petition_project.reference %}">Télécharger les haies (SIG)</a>
    </li>
    {% if petition_project.dn_archive %}
      <li>
        <a class="fr-btn fr-btn--secondary fr-btn--icon-left fr-icon-download-line"
           title="Archive Démarche Numérique"
           href="{{ petition_project.dn_archive.url }}"
           download="Archive_DN_{{ petition_project.reference }}.zip">Télécharger l'archive Démarche Numérique</a>
      </li>
    {% endif %}
  </ul>
</div>
